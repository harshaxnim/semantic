[project]
name = "semantic"
version = "0.0.1"
description = "Multi-lens problem decomposition harness: benchmarks, verifiers, model gateway and swarm."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semantic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
